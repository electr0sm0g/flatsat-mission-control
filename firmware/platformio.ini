; Adjusted for this repo's flat layout: source files sit directly in this
; folder (unlike the internal tree this was extracted from, which nested
; them under New-firmware/).
[platformio]
src_dir = .

[env:pico_tinyusb]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags = -DUSE_TINYUSB
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    makuna/NeoPixelBus @ ^2.8.0
    sparkfun/SparkFun LIS2DH12 Arduino Library @ ^1.0.3
    adafruit/Adafruit BME280 Library @ ^2.2.4
; flatsat-lab v2 notes:
;  - The vulnerable build fits the stock 2 MB UF2 path unchanged; the OTA
;    A/B slots (V-18) live in the EXTERNAL 4 MB QSPI NOR (IS25LP032D on
;    /QSPI_SS,/QSPI_SD0..3), addressed by the flashstore module through the
;    bootrom rom_flash_range_* API -- no board_build.flash_size change is
;    required for XIP (the RP2040 XIP window still maps the 2 MB internal
;    image area only; slot B at 0x200000 and meta sector at 0x3FC000 are
;    raw NOR offsets on the external chip).
;  - No new libraries: cmac/sdls/memserv/sb/fdir/covert/anomaly/flashstore/
;    mission_model/extcmds are plain C++ in this folder.
