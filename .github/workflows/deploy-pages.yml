# SPDX-License-Identifier: GPL-2.0-or-later
# GitHub Pages deployment of the in-browser mission control.
# The site is the committed self-contained bundle web/dist/ (single
# index.html with everything baked in — Pyodide + simulator + 56 PoCs +
# mermaid — plus worker.js); we stage it with the demo GIF it references
# under assets/ and hand the folder to the official Pages actions.
name: Deploy mission control (Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/dist/**"
      - "assets/sweep-demo.gif"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (bundle + demo asset)
        run: |
          mkdir site
          cp web/dist/index.html web/dist/worker.js web/dist/CNAME web/dist/_headers site/
          mkdir -p site/assets
          cp assets/sweep-demo.gif site/assets/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
